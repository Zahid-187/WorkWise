<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkWise – Fair, Safe, Transparent Work</title>
  <script src="/vendor/tailwind.js"></script>
  <link  rel="stylesheet" href="/css/style.css" />
  <script>
    // Tailwind theme config must be set before Alpine loads
    tailwind.config = {
      theme: { extend: { colors: { primary: 'var(--primary)' } } }
    };
  </script>
</head>
<body class="min-h-dvh flex flex-col">

<div x-data="landingApp()" x-init="init()" class="flex flex-col min-h-dvh">

  <!-- ── Header ── -->
  <header class="px-4 pt-6 pb-4 text-center">
    <div class="text-4xl mb-1" x-text="ind.icon"></div>
    <h1 class="text-3xl font-black tracking-tight text-gray-900">WorkWise</h1>
    <p class="text-sm text-gray-500 mt-1">Fair · Safe · Transparent · SDG 8</p>
  </header>

  <!-- ── Industry Toggle ── -->
  <div class="px-4 mb-6">
    <div class="flex bg-gray-100 rounded-xl p-1 max-w-sm mx-auto">
      <button
        @click="setIndustry('construction')"
        :class="industry==='construction' ? 'bg-white shadow text-orange-600 font-bold' : 'text-gray-500'"
        class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all tap-target flex items-center justify-center gap-1.5"
      >🏗️ Construction</button>
      <button
        @click="setIndustry('college')"
        :class="industry==='college' ? 'bg-white shadow text-indigo-600 font-bold' : 'text-gray-500'"
        class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all tap-target flex items-center justify-center gap-1.5"
      >🎓 College</button>
    </div>
  </div>

  <!-- ── Role Cards ── -->
  <main class="flex-1 px-4 flex flex-col gap-4 max-w-sm mx-auto w-full">

    <!-- Worker Card -->
    <div class="card border-2 border-transparent hover:border-orange-300 transition-colors" :class="industry==='college' ? 'hover:border-indigo-300' : ''">
      <div class="flex items-center gap-3 mb-4">
        <span class="text-3xl">👷</span>
        <div>
          <h2 class="text-lg font-bold text-gray-900">I'm a <span x-text="ind.workerLabel"></span></h2>
          <p class="text-xs text-gray-500">View shifts, raise grievances, submit feedback</p>
        </div>
      </div>

      <!-- Worker selector -->
      <div x-show="!loadingWorkers && workers.length > 0">
        <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">Choose your name</label>
        <select
          x-model="selectedWorkerId"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 font-medium bg-white focus:ring-2 focus:border-transparent"
          :style="`focus:ring-color: ${ind.primary}`"
        >
          <option value="">— Select your name —</option>
          <template x-for="w in workers" :key="w.id">
            <option :value="w.id" x-text="`${w.avatar_emoji} ${w.name} (${w.role})`"></option>
          </template>
        </select>

        <button
          @click="goWorker()"
          :disabled="!selectedWorkerId"
          class="btn-primary w-full mt-3"
          :class="!selectedWorkerId ? 'opacity-40 cursor-not-allowed' : ''"
        >Enter Dashboard →</button>
      </div>

      <div x-show="loadingWorkers" class="text-center text-gray-400 py-4">Loading workers…</div>
    </div>

    <!-- Employer Card -->
    <div class="card border-2 border-transparent">
      <div class="flex items-center gap-3 mb-4">
        <span class="text-3xl">📊</span>
        <div>
          <h2 class="text-lg font-bold text-gray-900">Employer / Admin</h2>
          <p class="text-xs text-gray-500">Roster, grievances, AI insights</p>
        </div>
      </div>
      <button @click="goEmployer()" class="btn-primary w-full" style="background:#1E3A5F">
        Open Admin Dashboard →
      </button>
    </div>

  </main>

  <!-- ── Footer ── -->
  <footer class="text-center py-5 text-xs text-gray-400">
    Prompt Wars 2026 · SDG 8: Decent Work &amp; Economic Growth
  </footer>

</div>

<script src="/js/app.js"></script>
<script src="/vendor/alpine.min.js" defer></script>
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('landingApp', () => ({
    industry: WW.Session.industry,
    workers: [],
    loadingWorkers: true,
    selectedWorkerId: '',

    get ind() { return WW.INDUSTRIES[this.industry]; },

    async init() {
      WW.applyIndustryTheme(this.industry);
      await this.loadWorkers();
    },

    async setIndustry(ind) {
      this.industry = ind;
      WW.Session.industry = ind;
      WW.applyIndustryTheme(ind);
      this.selectedWorkerId = '';
      await this.loadWorkers();
    },

    async loadWorkers() {
      this.loadingWorkers = true;
      try {
        this.workers = await WW.apiFetch(`/api/workers?industry=${this.industry}`);
      } catch(e) { this.workers = []; }
      this.loadingWorkers = false;
    },

    goWorker() {
      if (!this.selectedWorkerId) return;
      const w = this.workers.find(x => x.id == this.selectedWorkerId);
      WW.Session.workerId   = this.selectedWorkerId;
      WW.Session.workerName = w ? w.name : '';
      WW.Session.role       = 'worker';
      window.location.href  = '/worker.html';
    },

    goEmployer() {
      WW.Session.role = 'employer';
      window.location.href = '/employer.html';
    },
  }));
});
</script>
</body>
</html>
